name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Secret Scanning Gate (TruffleHog)
  # =========================================================================
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # =========================================================================
  # 2. Backend CI (.NET 10: Format, Vulnerabilities, Build, Unit/Integration Tests)
  # =========================================================================
  backend-ci:
    name: Backend CI (.NET 10)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: part2_tenant_boundary_${{ github.run_id }}_${{ github.run_attempt }}
          # Synthetic GitHub-hosted fixture only; the app_user test opens without a password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PART2_BOUNDARY_TEST_OWNER: Host=127.0.0.1;Port=55439;Database=part2_tenant_boundary_${{ github.run_id }}_${{ github.run_attempt }};Username=postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install prescription renderer native dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1

      - name: Restore dependencies
        run: |
          dotnet restore backend/Hospital_CRM.Api/Hospital_CRM.Api.csproj
          dotnet restore tests/Hospital_CRM.Tests/Hospital_CRM.Tests.csproj

      - name: Vulnerable Package Audit
        run: |
          dotnet list backend/Hospital_CRM.Api/Hospital_CRM.Api.csproj package --vulnerable --include-transitive --format json > backend-audit.json
          python3 - <<'PY'
          import json
          report = json.load(open('backend-audit.json'))
          findings = [v for p in report['projects'] for f in p.get('frameworks', []) for kind in ('topLevelPackages', 'transitivePackages') for package in f.get(kind, []) for v in package.get('vulnerabilities', [])]
          assert not findings, 'Backend dependency advisory findings require remediation or release review.'
          PY

      - name: Recovery script safety checks (synthetic files only)
        shell: pwsh
        run: ./scripts/test-recovery-safety.ps1 -ArtifactsPath $env:RUNNER_TEMP

      - name: Code Formatting Check (dotnet format)
        run: dotnet format backend/Hospital_CRM.Api/Hospital_CRM.Api.csproj --verify-no-changes

      - name: Build Solution (Release)
        run: |
          dotnet build backend/Hospital_CRM.Api/Hospital_CRM.Api.csproj -c Release --no-restore
          dotnet build tests/Hospital_CRM.Tests/Hospital_CRM.Tests.csproj -c Release --no-restore

      - name: Provision roles in this job's disposable PostgreSQL fixture
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -X -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE app_user LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION; CREATE ROLE public_token_router NOLOGIN NOSUPERUSER NOBYPASSRLS;"

      - name: Run Automated Test Suite
        run: dotnet test tests/Hospital_CRM.Tests/Hospital_CRM.Tests.csproj -c Release --no-build --verbosity normal --logger trx --results-directory test-results

      - name: Require executed PostgreSQL boundary tests and record exact counts
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, json, os, xml.etree.ElementTree as ET
          documents = [ET.parse(path) for path in glob.glob('test-results/*.trx')]
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          results = [r.attrib for doc in documents for r in doc.findall('.//t:UnitTestResult', ns)]
          boundary = [r for r in results if 'Part2TenantBoundaryPostgresTests.' in r['testName']]
          counts = {outcome: sum(r['outcome'] == outcome for r in results) for outcome in sorted({r['outcome'] for r in results})}
          summary = {'outcomes': counts, 'postgresBoundaryResults': len(boundary), 'postgresBoundaryExecuted': sum(r['outcome'] in ('Passed', 'Failed') for r in boundary)}
          os.makedirs('test-results', exist_ok=True)
          open('test-results/counts.json', 'w').write(json.dumps(summary, indent=2))
          print(json.dumps(summary))
          assert boundary and all(r['outcome'] == 'Passed' for r in boundary), 'Real app_user PostgreSQL tests must execute and pass.'
          PY

      - name: Upload backend test counts and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-checks
          path: |
            test-results/*.trx
            test-results/counts.json
            backend-audit.json
            ${{ runner.temp }}/part2-recovery-selfcheck.json
          retention-days: 7

  # =========================================================================
  # 3. Frontend CI (React 19 + TypeScript: Lint & Build)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Node 22 / React 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Dependency high/critical gate
        run: npm audit --audit-level=high

      - name: Disposable target policy self-check
        run: node ../scripts/check-e2e-target.mjs --self-test

      - name: Static Code Lint (Oxlint)
        run: npm run lint

      - name: Production Bundle Verification (Vite + TypeScript)
        run: npm run build

  # =========================================================================
  # 4. Playwright Headless E2E — a real gate: the stack must come up and the
  #    suite must pass. A failure here fails the pipeline.
  # =========================================================================
  playwright-e2e:
    name: Playwright Headless E2E
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: hospital-crm-ci-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_DATABASE: hospital_crm_ci_${{ github.run_id }}_${{ github.run_attempt }}
      HOSPITAL_CRM_E2E_DISPOSABLE: 'true'
      E2E_BASE_URL: http://localhost:5173
      E2E_API_BASE_URL: http://localhost:8080/api/v1
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application stack (Postgres + API + Vite)
        working-directory: .
        run: |
          docker compose up -d --build

      - name: Verify run-owned containers before health/login/mutation
        working-directory: .
        run: node scripts/check-e2e-target.mjs

      - name: Wait for API and frontend health
        working-directory: .
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null \
               && curl -fsS http://localhost:5173 >/dev/null; then
              echo "Stack is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: the stack did not become healthy within 300s." >&2
          docker compose ps
          exit 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true

      - name: Show sanitized container status on failure
        if: failure()
        working-directory: .
        run: docker compose ps

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        working-directory: .
        run: docker compose down -v
